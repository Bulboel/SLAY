<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d1630">
  <meta name="description" content="Explore Bitch City dans ce mini-RPG original de capture de Slays.">
  <title>Bitch City — Slay RPG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23201832'/%3E%3Cpath d='M12 34 23 23l9 8 9-8 11 11-20 20z' fill='%23ff5cb8'/%3E%3Ccircle cx='32' cy='31' r='8' fill='%23ffe76a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="github.css">
  <style>.title-screen[hidden]{display:none}</style>
</head>
<body>
  <main class="shell" aria-label="Bitch City, mini jeu de rôle">
    <section class="game-card">
      <div class="topbar">
        <div class="brand"><span class="spark">✦</span> BITCH CITY <small>V0.0.1</small></div>
        <div class="bag" aria-live="polite"><span class="orb">◉</span> <span id="ballCount">0</span> Slayboule<span id="ballPlural">s</span></div>
      </div>
      <div id="stage" class="stage">
        <canvas id="game" width="640" height="480" aria-label="Zone de jeu. Utilisez les flèches ou ZQSD pour vous déplacer et Espace pour interagir."></canvas>
        <div id="titleScreen" class="title-screen">
          <div class="title-art" aria-hidden="true"><span>✦</span><span>✿</span><span>◆</span></div>
          <p class="eyebrow">UNE AVENTURE À HACKÉNIA</p>
          <h1>BITCH<br><em>CITY</em></h1>
          <p class="subtitle">Le premier pas vers la gloire. Et l’arène.</p>
          <label class="name-field">Nom du dresseur
            <input id="playerName" maxlength="12" value="Bulbo" autocomplete="off">
          </label>
          <button id="startButton">Commencer</button>
          <p class="hint">Flèches / ZQSD · Espace pour interagir</p>
        </div>
        <div id="areaLabel" class="area-label" aria-live="polite"></div>
        <div id="prompt" class="prompt" aria-hidden="true">ESPACE</div>
        <div id="dialogue" class="dialogue" hidden>
          <div class="portrait" id="portrait" aria-hidden="true"></div>
          <div class="speech">
            <strong id="speaker"></strong>
            <p id="dialogueText"></p>
            <span class="continue">Espace <b>▼</b></span>
          </div>
        </div>
      </div>
      <div class="mobile-controls" aria-label="Commandes tactiles">
        <div class="dpad">
          <button data-key="ArrowUp" aria-label="Haut">▲</button>
          <button data-key="ArrowLeft" aria-label="Gauche">◀</button>
          <button data-key="ArrowDown" aria-label="Bas">▼</button>
          <button data-key="ArrowRight" aria-label="Droite">▶</button>
        </div>
        <button class="action" data-action aria-label="Interagir">A</button>
      </div>
      <footer><span id="objective">Objectif : sortir de chez Bulbo</span><button id="resetButton">Recommencer</button></footer>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
